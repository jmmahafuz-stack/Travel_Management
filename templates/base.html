{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Travel{% endblock %}</title>
  <!-- Tailwind CDN for quick development use -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/darkmode.css' %}">
</head>
<body class="bg-pagebg min-h-screen text-gray-900">
  {% include 'navbar.html' %}

  <main class="max-w-screen-2xl mx-auto px-4 sm:px-8 lg:px-12 py-6">
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="rounded-md p-3 mb-2 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'success' %}bg-green-100 text-green-800{% else %}bg-blue-50 text-blue-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function(){
      const theme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      window.toggleTheme = function() {
        if (document.documentElement.classList.toggle('dark')) {
          localStorage.setItem('theme', 'dark');
        } else {
          localStorage.setItem('theme', 'light');
        }
        document.querySelectorAll('.dark-toggle').forEach(el => {
          el.innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });
      };

      document.addEventListener('DOMContentLoaded', function(){
        document.querySelectorAll('.dark-toggle').forEach(el => {
          el.innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        });
      });
    })();
  </script>
</body>
</html>
